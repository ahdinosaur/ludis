[workspace]
resolver = "3"
members = [
  "apply-stdio",
  "causality",
  "cmd",
  "ctx",
  "fs",
  "http",
  "lusid",
  "lusid-apply",
  "machine",
  "operation",
  "params",
  "plan",
  "render",
  "resource",
  "rimu-interop",
  "secrets",
  "ssh",
  "store",
  "system",
  "tree",
  "vm",
]

[workspace.dependencies]
age = "0.11.3"
age-core = "0.11"
async-trait = "0.1.89"
base64 = "0.22"
clap = { version = "4.6.1", features = ["derive", "env"] }
displaydoc = "0.2.5"
indexmap = "2.14.0"
nix = { version = "0.31.3", features = ["signal", "user"] }
rimu = { version = "0.2.0", git = "https://github.com/ahdinosaur/rimu" }
russh = "0.60"
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = { version = "1.0.149", features = ["indexmap"] }
sha2 = "0.11.0"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["fs", "io-std", "macros", "process", "rt-multi-thread", "signal", "time"] }
tracing = "0.1.44"
tui-term = "0.3"
url = { version = "2.5.8", features = ["serde"] }
vt100 = "0.16"
