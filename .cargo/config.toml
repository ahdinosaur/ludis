# Cross-compilation for aarch64 Linux uses the Debian/Ubuntu
# `gcc-aarch64-linux-gnu` package as both the final linker and the C
# compiler that `cc-rs` drives for ring/psm's per-arch asm. With reqwest
# on rustls (no openssl-sys) this is the only system dep needed for the
# cross-build to succeed.
#
# Arch users: `pacman -S aarch64-linux-gnu-gcc` provides the same binary.
#
# CI does not use this file — release.yml builds each arch on a native
# runner (ubuntu-24.04 / ubuntu-24.04-arm) and never cross-compiles.
[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"
