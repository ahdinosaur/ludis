[debian-13-x86-64]
arch = "x86-64"
os = { type = "linux", linux = "debian", debian = 13 }
image = { type = "qcow2", url = "https://cloud.debian.org/images/cloud/trixie/latest/debian-13-generic-amd64.qcow2" }
hash = { type = "sha512sums", url = "https://cloud.debian.org/images/cloud/trixie/latest/SHA512SUMS" }
user = "debian"
# Drain cloud-init's first-boot modules (the `packages:` injection from our
# seed ISO uses apt, which holds /var/lib/dpkg/lock) before the caller drives
# the VM. Idempotent: returns immediately once cloud-init is done.
ready_check = "cloud-init status --wait"

[arch-x86-64]
arch = "x86-64"
os = { type = "linux", linux = "arch" }
image = { type = "qcow2", url = "https://fastly.mirror.pkgbuild.com/images/latest/Arch-Linux-x86_64-cloudimg.qcow2" }
hash = { type = "sha256sums", url = "https://fastly.mirror.pkgbuild.com/images/latest/Arch-Linux-x86_64-cloudimg.qcow2.SHA256" }
user = "arch"
# `cloud-init status --wait` drains cloud-init's package install (`openssh`
# from our seed ISO via pacman). `reflector.service` runs in parallel from
# the cloud image's systemd preset and holds /var/lib/pacman/db.lck while
# refreshing mirrors; polling the lock file catches it and anything else
# outside cloud-init's tracking. Both no-op on settled re-runs. `$?` capture
# preserves cloud-init's exit code (1=warnings, 2=errors) through the lock
# wait so the caller can log degraded first-boots.
ready_check = "cloud-init status --wait; rc=$?; while [ -e /var/lib/pacman/db.lck ]; do sleep 1; done; exit $rc"
